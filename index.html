<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071016">
  <title>GrassSTATory v22.3.1</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <div class="app">
      <main class="screen splash static-splash">
        <div class="brandmark">GS</div>
        <div class="wordmark">Grass<em>STAT</em>ory</div>
        <p class="tagline">Your football.<br>Your stats.<br>Your story.</p>
        <div class="version">Premium · v22.3.1</div>
        <button class="primary" type="button" disabled id="boot-status">Loading GrassSTATory…</button>
        <noscript><p class="boot-error">JavaScript is required to run this prototype.</p></noscript>
      </main>
    </div>
  </div>
  <div id="pulse" class="pulse"></div>
  <script>
    window.addEventListener('error', function(e){
      var b=document.getElementById('boot-status');
      if(b){b.disabled=false;b.textContent='Startup error — refresh page';b.className='danger';}
      console.error('GrassSTATory startup error',e.error||e.message);
    });
  </script>
  <script src="./app.js"></script>
</body>
</html>
